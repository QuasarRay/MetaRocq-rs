name: Original MetaRocq single-image contract

on:
  push:
    branches:
      - experiment/original-metarocq-selfhost-04-single-image-contract
    paths:
      - 'metatheory/original-selfhost/**'
      - 'spec/original-metarocq-single-image.json'
      - '.github/workflows/original-metarocq-single-image-contract.yml'
      - 'tools/bootstrap.py'
      - 'tools/install_extraction.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-metarocq-single-image-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPAMROOT: ${{ github.workspace }}/.aegis/opam-root
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install exact MetaRocq and Peregrine bootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev clang
          python3 tools/bootstrap.py sources
          bash tools/install_extraction.sh

      - name: Compile retained and single-image MetaRocq architecture
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          Q='-Q metatheory/original-selfhost MetaRocqRs.OriginalSelfHost'
          for f in             PipelineIR.v OpenTheoryIR.v PCUICModuleManifest.v SelfSnapshot.v             MaterializeSnapshot.v HOLProofIR.v OpenTheorySerialize.v             RuntimeImage.v RetainedPayload.v SelfHostRunner.v ExtractionRoot.v             VerifiedRuntimeAnchors.v RecursiveTrustGraph.v SingleImageContract.v             SingleImageRunner.v SingleImageExtractionRoot.v ExtractSingleImage.v
          do
            rocq compile $Q "metatheory/original-selfhost/$f"
          done
          test -s generated/original-selfhost/single-image.ast

      - name: Lower the one MetaRocq root to CakeML as an untrusted translation artifact
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          peregrine cakeml generated/original-selfhost/single-image.ast             -o generated/original-selfhost/single-image.cml
          test -s generated/original-selfhost/single-image.cml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-metarocq-single-image-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated/original-selfhost/
          if-no-files-found: error
