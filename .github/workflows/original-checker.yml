name: Original checker kernel replay
on:
  pull_request:
    paths:
      - 'metatheory/bootstrap/**'
      - 'tools/replay_original_checker.py'
      - 'tools/checker_ci_persistence.py'
      - 'tools/install_extraction.sh'
      - 'spec/toolchain.lock.json'
      - '.github/workflows/original-checker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-checker-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    # Bootstrap formalization must run while the implementation gate is closed.
    # Successful replay here does not itself open that gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: actions-ephemeral
          POSTGRES_DB: aegis_checker
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      OPAMROOT: ${{ github.workspace }}/.aegis/opam-root
      AEGIS_CHECKER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r .agents/database/requirements.txt
      - name: Restore all committed Aegis history and activate the task login
        id: persistence
        env:
          AEGIS_ADMIN_DSN: postgresql://postgres:actions-ephemeral@localhost:5432/aegis_checker
        run: python3 -B tools/checker_ci_persistence.py init
      - run: python3 -B tools/bootstrap.py sources
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev clang
      - name: Reuse the extraction dependency cache identity
        id: identity
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          lock = json.loads(Path('spec/toolchain.lock.json').read_text())
          inputs = {name: lock['repositories'][name] for name in ('metarocq', 'peregrine')}
          inputs['recipe'] = Path('tools/install_extraction.sh').read_text()
          inputs['image'] = os.environ['ImageOS'] + os.environ['ImageVersion']
          key = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('key=opam-v1-' + key + '\n')
          PYTHON
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            .aegis/opam-root
            .aegis/opam
          key: ${{ steps.identity.outputs.key }}-complete
          restore-keys: ${{ steps.identity.outputs.key }}-partial-
      - name: Reconcile the exact existing source pins and dependency recipe
        id: install
        env:
          OPAMSKIPUPDATE: 'true'
        run: |
          mkdir -p .aegis/original-checker
          set -o pipefail
          bash tools/install_extraction.sh 2>&1 | tee .aegis/original-checker/install.log
      - name: Save dependencies before checking candidate proofs
        if: steps.install.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .aegis/opam-root
            .aegis/opam
          key: ${{ steps.identity.outputs.key }}-complete
      - name: Preserve a partial dependency build
        if: failure() && steps.install.outcome == 'failure'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .aegis/opam-root
            .aegis/opam
          key: ${{ steps.identity.outputs.key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain installation observations
        if: steps.install.outcome == 'success'
        run: |
          cp .aegis/opam-switch.export .aegis/original-checker/
          opam list --switch .aegis/opam --installed --json=.aegis/original-checker/opam-installed.json
          git -C .aegis/references/metarocq rev-parse HEAD > .aegis/original-checker/metarocq-commit.txt
          git -C .aegis/references/metarocq status --porcelain=v1 > .aegis/original-checker/metarocq-worktree.txt
      - name: Compile, replay with the separate kernel checker, and reject negative controls
        id: replay
        run: opam exec --switch .aegis/opam -- python3 -B tools/replay_original_checker.py
      - name: Export every Aegis event before runner teardown
        if: always() && env.AEGIS_TASK_DSN != ''
        env:
          AEGIS_JOB_STATUS: ${{ job.status }}
        run: python3 -B tools/checker_ci_persistence.py export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-checker-${{ github.run_id }}-${{ github.run_attempt }}
          path: .aegis/original-checker/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-checker-aegis-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agents/data/
          include-hidden-files: true
          if-no-files-found: error
