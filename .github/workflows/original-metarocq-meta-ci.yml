name: Original MetaRocq meta-CI bootstrap

on:
  push:
    branches:
      - experiment/original-metarocq-selfhost-05-metarocq-ci
    paths:
      - 'metatheory/original-selfhost/**'
      - '.github/workflows/original-metarocq-meta-ci.yml'
      - 'tools/bootstrap.py'
      - 'tools/install_extraction.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-metarocq-meta-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-meta-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPAMROOT: ${{ github.workspace }}/.aegis/opam-root
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned bootstrap toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev clang
          python3 tools/bootstrap.py sources
          bash tools/install_extraction.sh

      - name: Compile MetaRocq-owned policy and extraction root
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          Q='-Q metatheory/original-selfhost MetaRocqRs.OriginalSelfHost'
          for f in             PipelineIR.v OpenTheoryIR.v PCUICModuleManifest.v SelfSnapshot.v             MaterializeSnapshot.v HOLProofIR.v OpenTheorySerialize.v             RuntimeImage.v RetainedPayload.v SelfHostRunner.v ExtractionRoot.v             VerifiedRuntimeAnchors.v RecursiveTrustGraph.v SingleImageContract.v             SingleImageRunner.v SingleImageExtractionRoot.v             CakeMLImageIR.v SelfHostCI.v SelfHostCIInterpreter.v             MetaCIExtractionRoot.v ExtractMetaCI.v
          do
            rocq compile $Q "metatheory/original-selfhost/$f"
          done
          test -s generated/original-selfhost/meta-ci.ast

      - name: Lower MetaRocq meta-CI to CakeML translation artifact
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          peregrine cakeml generated/original-selfhost/meta-ci.ast             -o generated/original-selfhost/meta-ci.cml
          test -s generated/original-selfhost/meta-ci.cml

      - name: Record bootstrap-only boundary
        run: |
          printf '%s\n'             'Acceptance policy is owned by MetaCIExtractionRoot; this workflow is only a bootstrap host.'             > generated/original-selfhost/META-CI-BOOTSTRAP-BOUNDARY.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-metarocq-meta-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated/original-selfhost/
          if-no-files-found: error
