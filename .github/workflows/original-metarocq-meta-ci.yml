name: Incident cancellation shim

on:
  push:
    branches:
      - experiment/original-metarocq-selfhost-05-metarocq-ci
    paths:
      - '.github/workflows/original-metarocq-meta-ci.yml'

permissions:
  contents: read

concurrency:
  group: original-metarocq-meta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-shim:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    steps:
      - run: echo unreachable
