name: Incident recovery cancel all Actions

on:
  push:
    branches:
      - ops/actions-incident-drain-2026-10-04
    paths:
      - '.github/workflows/incident-cancel-all.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: incident-actions-drain
  cancel-in-progress: true

jobs:
  drain:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Cancel every other active workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          self_id = int(os.environ["GITHUB_RUN_ID"])
          api = "https://api.github.com"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "metarocq-actions-incident-recovery",
          }

          def call(url, method="GET"):
              req = urllib.request.Request(
                  url,
                  data=b"" if method == "POST" else None,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      return resp.status, (json.loads(body) if body else None)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  print(f"{method} {url} -> HTTP {exc.code}: {body[:500]}")
                  return exc.code, None

          def list_active():
              active = []
              page = 1
              while True:
                  status, data = call(
                      f"{api}/repos/{repo}/actions/runs?per_page=100&page={page}"
                  )
                  if status != 200 or not data:
                      raise SystemExit(f"Unable to list workflow runs: HTTP {status}")
                  runs = data.get("workflow_runs", [])
                  for run in runs:
                      if run["id"] != self_id and run["status"] != "completed":
                          active.append({
                              "id": run["id"],
                              "name": run["name"],
                              "status": run["status"],
                              "branch": run.get("head_branch"),
                          })
                  if len(runs) < 100:
                      break
                  page += 1
              return active

          def cancel(active, endpoint):
              for run in active:
                  rid = run["id"]
                  status, _ = call(
                      f"{api}/repos/{repo}/actions/runs/{rid}/{endpoint}",
                      method="POST",
                  )
                  print(
                      f"{endpoint}: run={rid} status={run['status']} "
                      f"branch={run['branch']} workflow={run['name']} -> HTTP {status}"
                  )

          for round_no in range(1, 7):
              active = list_active()
              print(f"cancel round {round_no}: {len(active)} active run(s)")
              if not active:
                  raise SystemExit(0)
              cancel(active, "cancel")
              time.sleep(5)

          for round_no in range(1, 7):
              active = list_active()
              print(f"force-cancel round {round_no}: {len(active)} active run(s)")
              if not active:
                  raise SystemExit(0)
              cancel(active, "force-cancel")
              time.sleep(5)

          remaining = list_active()
          print("remaining:", json.dumps(remaining, indent=2))
          if remaining:
              raise SystemExit("Failed to drain all other workflow runs")
          PY
