name: Original MetaRocq single-image bootstrap

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  materialize-single-image-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPAMROOT: ${{ github.workspace }}/.aegis/opam-root
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned MetaRocq and Peregrine
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev clang
          python3 tools/bootstrap.py sources
          bash tools/install_extraction.sh

      - name: Compile MetaRocq-owned single-image architecture
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          mkdir -p generated/original-selfhost
          Q='-Q metatheory/original-selfhost MetaRocqRs.OriginalSelfHost'
          for f in \
            PipelineIR.v OpenTheoryIR.v PCUICModuleManifest.v SelfSnapshot.v \
            MaterializeSnapshot.v HOLProofIR.v OpenTheorySerialize.v \
            RuntimeImage.v RetainedPayload.v SelfHostRunner.v ExtractionRoot.v \
            HOL4ReuseManifest.v DualProofLedger.v CandleMachineChain.v \
            SelfCICD.v SingleImageContract.v SingleImageEntrypoint.v \
            ExtractSingleImage.v
          do
            rocq compile $Q "metatheory/original-selfhost/$f"
          done
          test -s generated/original-selfhost/single-image.ast

      - name: Lower single-image root to CakeML
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          peregrine cakeml generated/original-selfhost/single-image.ast \
            -o generated/original-selfhost/single-image.cml
          test -s generated/original-selfhost/single-image.cml
          printf '%s\n' \
            'CakeML source produced; not trusted until local Candle/CakeML theorem bindings close.' \
            > generated/original-selfhost/SINGLE-IMAGE-STATUS.txt

      - name: Preserve stack evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-metarocq-single-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            generated/original-selfhost/
            metatheory/original-selfhost/*.vo
            metatheory/original-selfhost/*.vos
            metatheory/original-selfhost/*.glob
          if-no-files-found: error
