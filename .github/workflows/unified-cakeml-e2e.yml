name: Unified CakeML Peregrine + MetaRocq E2E
run-name: Unified E2E ${{ inputs.target_ref || github.event.comment.body || 'experiment/cakeml-unified-e2e-03-cachyos-docs' }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: E2E branch to check out and run
        required: true
        default: experiment/cakeml-unified-e2e-03-cachyos-docs
        type: string
  workflow_call:
    inputs:
      target_ref:
        description: E2E branch to check out and run
        required: false
        default: experiment/cakeml-unified-e2e-03-cachyos-docs
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: unified-cakeml-e2e-${{ inputs.target_ref || github.event.comment.id || 'manual' }}
  cancel-in-progress: false

jobs:
  explicit-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.title == 'Manual Unified CakeML E2E dispatch control' &&
       github.actor == github.repository_owner &&
       (github.event.comment.body == '/run-unified-e2e' ||
        startsWith(github.event.comment.body, '/run-unified-e2e ')))
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      E2E_TARGET_REF: ${{ inputs.target_ref || 'experiment/cakeml-unified-e2e-03-cachyos-docs' }}
      E2E_ISSUE_COMMAND: ${{ github.event.comment.body || '' }}
      CAKEML_REGRESSION_DIR: ${{ github.workspace }}/.aegis/references/cakeml-regression

    steps:
      - name: Bootstrap repository checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Resolve and validate explicit E2E target branch
        shell: bash
        run: |
          set -euo pipefail
          target="$E2E_TARGET_REF"
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            case "$E2E_ISSUE_COMMAND" in
              "/run-unified-e2e")
                target="experiment/cakeml-unified-e2e-03-cachyos-docs"
                ;;
              "/run-unified-e2e "*)
                target="${E2E_ISSUE_COMMAND#"/run-unified-e2e "}"
                ;;
              *)
                echo "Invalid manual E2E command." >&2
                exit 2
                ;;
            esac
          fi
          if [[ -z "$target" || "$target" =~ [[:space:]] ]]; then
            echo "Refusing malformed E2E target branch: '$target'" >&2
            exit 2
          fi
          case "$target" in
            experiment/cakeml-unified-e2e-*) ;;
            *)
              echo "Refusing non-E2E target branch: $target" >&2
              exit 2
              ;;
          esac
          echo "E2E_TARGET_REF=$target" >> "$GITHUB_ENV"
          echo "Resolved E2E target: $target"

      - name: Checkout selected E2E branch with full history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$E2E_TARGET_REF"
          git checkout --force -B "$E2E_TARGET_REF" "origin/$E2E_TARGET_REF"
          git branch --set-upstream-to="origin/$E2E_TARGET_REF" "$E2E_TARGET_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$E2E_TARGET_REF")"

      - name: Synchronize origin and open unique trace directory
        shell: bash
        run: |
          trace="$(tools/o11y_begin.sh)"
          echo "Trace directory: $trace"

      - name: Restore pinned extraction toolchain cache
        id: opam-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .aegis/opam-root
            .aegis/opam
          key: metarocq-extraction-${{ runner.os }}-${{ hashFiles('spec/toolchain.lock.json', 'tools/install_extraction.sh') }}

      - name: Install host prerequisites with regression-style capture
        shell: bash
        run: |
          tools/o11y_observe.sh host-prerequisites bash -lc '
            sudo apt-get update &&
            sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev clang polyml curl git time
          '

      - name: Pin CakeML regression source with captured diagnostics
        shell: bash
        run: |
          tools/o11y_observe.sh cakeml-regression-source bash -lc '
            rm -rf "$CAKEML_REGRESSION_DIR" &&
            git clone https://github.com/CakeML/regression.git "$CAKEML_REGRESSION_DIR" &&
            git -C "$CAKEML_REGRESSION_DIR" checkout --detach 23cfeba74d0cef77f7274ab41a2e8e87d4032995 &&
            test "$(git -C "$CAKEML_REGRESSION_DIR" rev-parse HEAD)" = 23cfeba74d0cef77f7274ab41a2e8e87d4032995
          '

      - name: Build CakeML controller with captured diagnostics
        shell: bash
        run: tools/o11y_observe.sh build-cakeml-controller bash tools/build_unified_e2e_cakeml.sh

      - name: Execute unified CakeML controller
        shell: bash
        run: tools/run_unified_e2e_with_traces.sh

      - name: Execute requested Peregrine source-to-machine lane
        if: ${{ always() && env.E2E_TRACE_DIR != '' }}
        shell: bash
        run: tools/o11y_observe.sh requested-peregrine-source-machine bash tools/run_peregrine_requested_e2e.sh

      # A proof failure must not discard a successfully installed exact-key
      # producer. This cache is acceleration, never proof evidence.
      - name: Check completed extraction toolchain for cache preservation
        if: ${{ !cancelled() && steps.opam-cache.outputs.cache-hit != 'true' }}
        id: toolchain-ready
        shell: bash
        run: |
          if [[ -x .aegis/opam/_opam/bin/rocq &&
                -x .aegis/opam/_opam/bin/peregrine &&
                -s .aegis/opam-switch.export ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve completed pinned extraction toolchain cache
        if: ${{ !cancelled() && steps.toolchain-ready.outputs.ready == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .aegis/opam-root
            .aegis/opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Finalize trace hashes
        if: ${{ always() && env.E2E_TRACE_DIR != '' }}
        shell: bash
        run: tools/o11y_finalize.sh

      - name: Append trace commit to selected E2E branch without force-push
        if: ${{ always() && env.E2E_TRACE_DIR != '' }}
        shell: bash
        run: tools/o11y_sync.sh

      - name: Preserve run directory as Actions artifact
        if: ${{ always() && env.E2E_TRACE_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_TRACE_DIR }}
          if-no-files-found: error
