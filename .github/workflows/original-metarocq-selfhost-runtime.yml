name: Original MetaRocq retained selfhost runtime

on:
  push:
    branches:
      - experiment/original-metarocq-selfhost-03-retained-runtime
    paths:
      - 'metatheory/original-selfhost/**'
      - 'spec/original-metarocq-selfhost*.json'
      - 'tools/bootstrap.py'
      - 'tools/install_extraction.sh'
      - '.github/workflows/original-metarocq-selfhost-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-metarocq-selfhost-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPAMROOT: ${{ github.workspace }}/.aegis/opam-root
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install exact MetaRocq and Peregrine bootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev clang
          python3 tools/bootstrap.py sources
          bash tools/install_extraction.sh

      - name: Compile MetaRocq-owned retained runtime
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          Q='-Q metatheory/original-selfhost MetaRocqRs.OriginalSelfHost'
          for f in             PipelineIR.v OpenTheoryIR.v PCUICModuleManifest.v SelfSnapshot.v             MaterializeSnapshot.v HOLProofIR.v OpenTheorySerialize.v             RuntimeImage.v RetainedPayload.v SelfHostRunner.v ExtractionRoot.v             ExtractSelfHost.v
          do
            rocq compile $Q "metatheory/original-selfhost/$f"
          done
          test -s generated/original-selfhost/selfhost.ast

      - name: Produce CakeML source without trusting backend axiom
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          mkdir -p generated/original-selfhost
          peregrine cakeml generated/original-selfhost/selfhost.ast             -o generated/original-selfhost/selfhost.cml
          test -s generated/original-selfhost/selfhost.cml
          printf '%s\n'             'Peregrine output is a translation artifact only; trust_coq_kernel is forbidden as proof evidence.'             > generated/original-selfhost/PEREGRINE-TRUST-BOUNDARY.txt

      - name: Preserve lambda-box and CakeML evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-metarocq-selfhost-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            generated/original-selfhost/
            metatheory/original-selfhost/*.vo
            metatheory/original-selfhost/*.vos
            metatheory/original-selfhost/*.glob
          if-no-files-found: error
