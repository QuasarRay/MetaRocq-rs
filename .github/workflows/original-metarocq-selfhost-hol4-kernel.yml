name: Original MetaRocq HOL4-kernel selfhost E2E

on:
  push:
    branches:
      - experiment/original-metarocq-selfhost-09-hol4-kernel-e2e
    paths:
      - 'metatheory/original-selfhost/**'
      - 'formal/hol4/**'
      - 'spec/hol4-selfhost-e2e.json'
      - 'tools/check_hol4_selfhost_contract.py'
      - 'tools/install_extraction.sh'
      - 'docs/adr/0015-hol4-kernel-self-reflection-e2e.md'
      - '.github/workflows/original-metarocq-selfhost-hol4-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-metarocq-selfhost-hol4-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hol4-selfhost-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      OPAMROOT: ${{ github.workspace }}/.aegis/opam-root
      OPAMJOBS: "4"
      HOL4_DIR: ${{ github.workspace }}/.aegis/references/hol4
      CAKEML_DIR: ${{ github.workspace }}/.aegis/references/cakeml
      PEREGRINE_DIR: ${{ github.workspace }}/.aegis/references/peregrine-upstream
      CAKEML_BACKEND_DIR: ${{ github.workspace }}/.aegis/references/cakeml-backend

    steps:
      - name: Checkout MetaRocq-rs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout pinned HOL4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HOL-Theorem-Prover/HOL
          ref: 40dd5b03de658f4bd9e3f4225fb0f1602ac90467
          path: .aegis/references/hol4

      - name: Checkout pinned CakeML
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CakeML/cakeml
          ref: c98da7fc904c5d6d0e9a75a18fac1796a9bfb1f9
          path: .aegis/references/cakeml

      - name: Checkout pinned Peregrine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: peregrine-project/peregrine-tool
          ref: d768b83ffa7dab35b8d72241f0570b5bb6aedae9
          path: .aegis/references/peregrine-upstream

      - name: Checkout pinned Peregrine CakeML backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: peregrine-project/cakeml-backend
          ref: cc20d1a2986bd2fec7c6eb0864c8c9a806188b58
          path: .aegis/references/cakeml-backend

      - name: Verify exact source and active-kernel contract
        run: python3 tools/check_hol4_selfhost_contract.py

      - name: Restore pinned opam switch
        id: opam-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .aegis/opam-root
            .aegis/opam
          key: metarocq-extraction-${{ runner.os }}-${{ hashFiles('spec/toolchain.lock.json', 'tools/install_extraction.sh') }}

      - name: Install pinned MetaRocq and Peregrine
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev clang polyml
          python3 tools/bootstrap.py sources
          bash tools/install_extraction.sh

      - name: Save pinned opam switch
        if: steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .aegis/opam-root
            .aegis/opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Compile Candle-free HOL4 self-reflective runtime
        run: |
          eval "$(opam env --switch .aegis/opam --set-switch)"
          mkdir -p generated/original-selfhost
          Q='-Q metatheory/original-selfhost MetaRocqRs.OriginalSelfHost'
          for f in \
            PipelineIR.v OpenTheoryIR.v PCUICModuleManifest.v SelfSnapshot.v \
            MaterializeSnapshot.v HOLProofIR.v OpenTheorySerialize.v \
            RuntimeImage.v RetainedPayload.v SelfHostRunner.v ExtractionRoot.v \
            HOL4ReuseManifest.v CandleMachineChain.v CandlePrefixManifest.v \
            PCUICCertificateIR.v PCUICDeepEmbeddingSchema.v SafeCheckerContract.v \
            CertificateReplayIR.v HOL4RoundTripIR.v CandleExportContract.v \
            DeepEmbeddingStatus.v DualProofLedger.v SelfCICD.v \
            SelfCICDInterpreter.v SingleImageContract.v SingleImageEntrypoint.v \
            EmbeddedPeregrine.v MetaRocqSuffixSafety.v CandlePrefixComposition.v \
            CakeMLBackendTrustLedger.v CandidateCakeMLCompiler.v \
            CakeMLTranslationCertificate.v ValidatedCakeMLGateway.v \
            RecursiveSelfIdentity.v SharedImageEntrypoint.v \
            ValidatedSharedImageEntrypoint.v EAstSupportedFragment.v \
            CakeMLNoRaise.v CheckedCandidateCakeML.v CheckedSharedImageEntrypoint.v \
            ReflectiveDualRecursion.v ReconciledSelfHostEntrypoint.v \
            HOL4KernelContract.v SourceLambdaBoxRefinement.v \
            IntegratedPeregrineCakeML.v HOL4MachineRefinement.v \
            HOL4ProofLedger.v HOL4CertificateReplayIR.v \
            HOL4RecursiveSelfIdentity.v HOL4SelfHostEntrypoint.v \
            ExtractHOL4SelfHost.v
          do
            rocq compile $Q "metatheory/original-selfhost/$f"
          done
          test -s generated/original-selfhost/hol4-selfhost.ast

      - name: Build pinned HOL4 kernel
        run: |
          cd "$HOL4_DIR"
          poly --script tools/smart-configure.sml
          bin/build

      - name: Kernel-check HOL4 qualification theory
        run: |
          mkdir -p generated/hol4/kernel
          cp formal/hol4/MetaRocqSelfHostKernelScript.sml generated/hol4/kernel/
          cd generated/hol4/kernel
          "$HOL4_DIR/bin/Holmake"
          find . -type f -name "MetaRocqSelfHostKernelTheory.dat" -print -quit | grep -q .

      - name: Require exact MetaRocq source-to-machine HOL4 theorem
        run: |
          theorem=formal/hol4/MetaRocqSelfHostE2EScript.sml
          if [ ! -s "$theorem" ]; then
            echo "::error::Missing exact MetaRocq Selfhost E2E HOL4 theorem. Generic CakeML compiler correctness or kernel qualification is not sufficient."
            echo "::error::The required theorem must bind the pinned source/LambdaBox identity, exact generated CakeML program, eval_cake_compile_x64 result, compile_correct/x64 obligations, concrete bytes, installed image, and recursive self replay."
            exit 1
          fi
          mkdir -p generated/hol4/e2e
          cp "$theorem" generated/hol4/e2e/
          cd generated/hol4/e2e
          "$HOL4_DIR/bin/Holmake"
          find . -type f -name "MetaRocqSelfHostE2ETheory.dat" -print -quit | grep -q .

      - name: Preserve HOL4 selfhost evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-metarocq-hol4-selfhost-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            generated/original-selfhost/
            generated/hol4/
            metatheory/original-selfhost/*.vo
            metatheory/original-selfhost/*.vos
            metatheory/original-selfhost/*.glob
            spec/hol4-selfhost-e2e.json
          if-no-files-found: error
