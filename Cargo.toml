[package]
name = "metarocq-bootstrap"
version = "0.0.0"
edition = "2021"
publish = false
license-file = "LICENSE.MD"
description = "Peregrine-generated PCUIC bootstrap candidate; not a verified checker"

[lib]
path = "src/lib.rs"

[workspace]
members = ["tools/rust-normalize"]

[features]
retained = []

[build-dependencies]
metarocq-rust-normalize = { path = "tools/rust-normalize" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
# Matches the pinned Peregrine test runner; no hand-written replacement runtime.
bumpalo = "=3.14.0"
